<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="16" fill="none">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00f2fe;#7928ca;#ff0080;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="1">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00f2fe;#7928ca" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#ff0080" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#ff0080;#00f2fe;#7928ca;#ff0080" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulsing-bar {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .center-orb {
      animation: float 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.65; transform: scaleY(0.9); }
      100% { opacity: 1; transform: scaleY(1.3); }
    }
    @keyframes float {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.2); opacity: 1; }
    }
  </style>

  <!-- Ambient Glow Line -->
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#laserGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" class="pulsing-bar" style="transform-origin: center;" />

  <!-- Core White Laser Line -->
  <line x1="80" y1="8" x2="820" y2="8" stroke="url(#coreGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Center Diamond Core -->
  <g class="center-orb" style="transform-origin: center;">
    <circle cx="450" cy="8" r="4" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="fill" values="#00f2fe;#7928ca;#ff0080;#00f2fe" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="8" r="1.8" fill="#ffffff" />
  </g>
</svg>
